name: Build Spindle dmg
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and dmg
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Spindle-dmg
          path: build/Spindle.dmg
