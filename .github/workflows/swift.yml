name: Build Spindle dmg
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and dmg
        run: |
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "error:|fatal error" build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Build error::${line}"
            done
          fi
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spindle-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload dmg
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Spindle-dmg
          path: build/Spindle.dmg

      # Stable public download link: Releases > Latest build > Spindle.dmg
      - name: Publish dmg to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --title "Latest build" --notes "Automatic build"
          gh release upload latest-build build/Spindle.dmg --clobber
          gh release edit latest-build --notes "Automatic build of $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%MZ))"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/latest-build/Spindle.dmg"
